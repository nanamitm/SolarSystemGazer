name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ─── Windows 64-bit ───────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt (MinGW 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310'
          cache: true

      - name: Configure and Build
        shell: pwsh
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4

      - name: Package with windeployqt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item build\SolarSystemGazer.exe dist\
          windeployqt --release dist\SolarSystemGazer.exe
          Compress-Archive -Path dist\* -DestinationPath SolarSystemGazer-win64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: win64
          path: SolarSystemGazer-win64.zip
          retention-days: 7

  # ─── Linux x86_64 AppImage ────────────────────────────────────────────────
  build-linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libgl-dev libglu1-mesa-dev libxcb-cursor-dev \
            cmake ninja-build icoutils

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -GNinja
          cmake --build build --parallel 4

      - name: Extract app icon (PNG)
        run: icotool -x -i 4 build/app_icon.ico -o icon.png

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/SolarSystemGazer AppDir/usr/bin/
          cp icon.png AppDir/usr/share/icons/hicolor/256x256/apps/solarsystemgazer.png
          cat > AppDir/usr/share/applications/solarsystemgazer.desktop << 'EOF'
          [Desktop Entry]
          Name=Solar System Gazer
          Exec=SolarSystemGazer
          Icon=solarsystemgazer
          Type=Application
          Categories=Education;Science;
          Comment=Solar system visualization based on NASA JPL orbital elements
          EOF

      - name: Download linuxdeploy
        run: |
          wget -qO linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -qO linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QMAKE: /usr/bin/qmake6
        run: |
          export PATH="$PWD:$PATH"
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage
          mv *.AppImage SolarSystemGazer-linux-x64.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: SolarSystemGazer-linux-x64.AppImage
          retention-days: 7

  # ─── Linux ARM64 AppImage ─────────────────────────────────────────────────
  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt6 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools \
            libgl-dev libglu1-mesa-dev libxcb-cursor-dev \
            cmake ninja-build icoutils

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -GNinja
          cmake --build build --parallel 4

      - name: Extract app icon (PNG)
        run: icotool -x -i 4 build/app_icon.ico -o icon.png

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin \
                   AppDir/usr/share/applications \
                   AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/SolarSystemGazer AppDir/usr/bin/
          cp icon.png AppDir/usr/share/icons/hicolor/256x256/apps/solarsystemgazer.png
          cat > AppDir/usr/share/applications/solarsystemgazer.desktop << 'EOF'
          [Desktop Entry]
          Name=Solar System Gazer
          Exec=SolarSystemGazer
          Icon=solarsystemgazer
          Type=Application
          Categories=Education;Science;
          Comment=Solar system visualization based on NASA JPL orbital elements
          EOF

      - name: Download linuxdeploy (ARM64)
        run: |
          wget -qO linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
          wget -qO linuxdeploy-plugin-qt \
            https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QMAKE: /usr/bin/qmake6
        run: |
          export PATH="$PWD:$PATH"
          ./linuxdeploy --appdir AppDir --plugin qt --output appimage
          mv *.AppImage SolarSystemGazer-linux-arm64.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: linux-arm64
          path: SolarSystemGazer-linux-arm64.AppImage
          retention-days: 7

  # ─── Android arm64-v8a APK ────────────────────────────────────────────────
  # 署名に必要な GitHub Secrets:
  #   ANDROID_KEYSTORE_BASE64 – base64 化した .jks（例: base64 -w0 keystore/solarsystemgazer-release.jks）
  #   ANDROID_STORE_PASSWORD  – キーストアのパスワード
  #   ANDROID_KEY_ALIAS       – 鍵エイリアス（solarsystemgazer）
  #   ANDROID_KEY_PASSWORD    – 鍵のパスワード
  # ※CI(aqt)が提供する Android 版は 6.7.x が最新（6.8+ は未提供）。
  #   6.7.x は SafeArea(6.7+)/Tumbler/QtCore Settings を含むのでビルド可能。
  #   ローカル開発は 6.11.1。配布物は CI の 6.7.x ビルドになる点に注意。
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4
        with:
          # Qt 6.7.x は SDK 34 世代。新しい SDK 36 だと aapt2 が android.jar を読めない
          packages: >-
            ndk;27.2.12479018
            platforms;android-34
            build-tools;34.0.0

      - name: Install Qt for Android (arm64-v8a + host desktop)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          extra: '--autodesktop'
          cache: true

      - name: Pin Android platform to 34
        # Qt 6.7.x の aapt2 はランナー同梱の SDK 35/36(ext) の android.jar を解析できないため、
        # それらを削除して android-34 を最新プラットフォームにする
        run: |
          rm -rf "${ANDROID_SDK_ROOT}"/platforms/android-3[56]* || true
          echo "Remaining platforms:"; ls "${ANDROID_SDK_ROOT}/platforms"

      - name: Configure CMake
        run: |
          cmake -S . -B build-android -G Ninja -Wno-dev \
            "-DCMAKE_MAKE_PROGRAM=$(which ninja)" \
            "-DCMAKE_TOOLCHAIN_FILE=${QT_ROOT_DIR}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=latest \
            "-DANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" \
            "-DANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/27.2.12479018" \
            "-DQT_HOST_PATH=${QT_HOST_PATH}" \
            -DSSG_ANDROID_COMPILE_SDK=34 \
            -DSSG_ANDROID_BUILD_TOOLS=34.0.0 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build APK (unsigned release)
        # androiddeployqt は Gradle 成功後に非0で終了することがあるが APK は生成される
        run: cmake --build build-android || true

      - name: Sign release APK (or keep unsigned if no secrets)
        env:
          KS_B64:    ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS:   ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS:  ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          src=$(find build-android/android-build/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$src" ]; then
            src=$(find build-android -name "*release*.apk" 2>/dev/null | head -1)
          fi
          if [ -z "$src" ]; then echo "No release APK found"; find build-android -name "*.apk"; exit 1; fi
          echo "Found APK: $src"
          BT="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          if [ -n "$KS_B64" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Signing release APK..."
            echo "$KS_B64" | base64 -d > "${{ runner.temp }}/keystore.jks"
            "${BT}/zipalign" -f -p 4 "$src" "${{ runner.temp }}/aligned.apk"
            "${BT}/apksigner" sign \
              --ks "${{ runner.temp }}/keystore.jks" \
              --ks-pass "pass:${KS_PASS}" \
              --ks-key-alias "${KEY_ALIAS}" \
              --key-pass "pass:${KEY_PASS}" \
              --out "SolarSystemGazer-android-arm64.apk" "${{ runner.temp }}/aligned.apk"
            "${BT}/apksigner" verify --print-certs "SolarSystemGazer-android-arm64.apk"
          else
            echo "::warning::署名Secrets未設定のため未署名APKを出力します（ANDROID_KEYSTORE_BASE64 等を設定してください）"
            cp "$src" "SolarSystemGazer-android-arm64-unsigned.apk"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: android-arm64
          path: SolarSystemGazer-android-arm64*.apk
          retention-days: 7

  # ─── GitHub Release ───────────────────────────────────────────────────────
  release:
    needs: [build-windows, build-linux-x64, build-linux-arm64, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            SolarSystemGazer-win64.zip
            SolarSystemGazer-linux-x64.AppImage
            SolarSystemGazer-linux-arm64.AppImage
            SolarSystemGazer-android-arm64*.apk
          generate_release_notes: true
